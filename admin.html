<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부울경 성경세미나 신앙상담 접수 현황 (관리자)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-navy: #0b1a3d;
            --secondary-navy: #152750;
            --accent-gold: #c59b27;
            --gold-light: #dfb64c;
            --bg-gray: #f4f6fa;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #1a202c;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-gray);
            color: var(--text-main);
            padding-bottom: 60px;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Header */
        .admin-header {
            background-color: var(--primary-navy);
            color: #ffffff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-gold);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .header-title h1 {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-title p {
            font-size: 0.72rem;
            color: var(--gold-light);
            margin-top: 1px;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--accent-gold);
            color: #ffffff;
            padding: 6px 11px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px 8px;
        }

        /* Stats Bar */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }

        .stat-card {
            background: #ffffff;
            padding: 9px 2px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .stat-value {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary-navy);
        }

        /* Search & Filter */
        .filter-box {
            background: #ffffff;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        .search-input {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid #d9e0e8;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: var(--accent-gold);
        }

        .day-tabs {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .day-tabs::-webkit-scrollbar {
            display: none;
        }

        .day-tab {
            padding: 5px 11px;
            background: #f1f4f9;
            border: 1px solid #d9e2ec;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #486581;
            cursor: pointer;
            white-space: nowrap;
        }

        .day-tab.active {
            background: var(--primary-navy);
            color: #ffffff;
            border-color: var(--primary-navy);
        }

        /* Applicant Card (Mobile-Optimized to look exactly like Image 2) */
        .applicant-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 14px 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 8px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #e2e8f0;
        }

        .admin-header { flex-wrap: wrap; gap: 8px; }
        .header-actions { display: flex; gap: 6px; }
        #refreshStatus { margin-bottom: 8px; font-size: 0.8rem; color: var(--text-muted); }
        .auth-label { display: block; margin-bottom: 6px; font-size: 0.85rem; }
        .target-name { font-family: inherit; border: 0; background: transparent; cursor: pointer; text-align: left; }
        .target-name:focus-visible { outline: 2px solid var(--accent-gold); }
        .target-name-area {
            display: flex;
            align-items: baseline;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .target-name {
            font-size: 1.22rem;
            font-weight: 700;
            color: var(--primary-navy);
            white-space: nowrap;
            letter-spacing: -0.3px;
        }

        .target-honorific {
            font-size: 0.82rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .schedule-badge {
            background: #fbf5e6;
            color: #8c6a0c;
            border: 1px solid #eddcb0;
            padding: 4px 8px;
            border-radius: 14px;
            font-size: 0.76rem;
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: -0.3px;
            margin-left: auto;
        }

        /* Section Boxes */
        .info-section {
            border-radius: 8px;
            padding: 10px 11px;
            margin-bottom: 8px;
        }

        .inviter-section {
            background: #eff6ff;
            border: 1.5px solid #bfdbfe;
        }

        .invitee-section {
            background: #f8fafc;
            border: 1px solid #eef2f6;
        }

        .info-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin-bottom: 6px;
        }

        .section-label {
            font-size: 0.82rem;
            font-weight: 700;
            color: #1d4ed8;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .invitee-section .section-label {
            color: var(--text-muted);
        }

        .section-person {
            font-size: 0.92rem;
            font-weight: 700;
            color: #1e293b;
            white-space: nowrap;
            letter-spacing: -0.2px;
        }

        /* 3 Buttons Grid (Calls, SMS, Copy Kakao) */
        .action-btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1.25fr;
            gap: 6px;
            margin-top: 6px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;
            padding: 8px 4px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            white-space: nowrap;
            letter-spacing: -0.5px;
            transition: transform 0.1s;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        .btn-call {
            background: #2563eb;
            color: #ffffff;
        }

        .btn-sms {
            background: #0284c7;
            color: #ffffff;
        }

        .btn-copy {
            background: #d97706;
            color: #ffffff;
        }

        .church-line { margin-bottom: 10px; font-size: 0.85rem; color: var(--text-muted); word-break: keep-all; overflow-wrap: anywhere; }

        .note-box {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #fffdf8;
            border: 1px solid #fcefc7;
            border-radius: 8px;
            padding: 9px 11px;
            margin-top: 8px;
            font-size: 0.82rem;
            color: #475569;
            line-height: 1.45;
            word-break: break-all;
        }

        .card-footer-time {
            margin-top: 8px;
            font-size: 0.72rem;
            color: #94a3b8;
            text-align: right;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #888888;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        /* Password Modal */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 26, 61, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 340px;
            padding: 28px 22px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .auth-card h2 {
            font-size: 1.2rem;
            color: var(--primary-navy);
            margin-bottom: 6px;
        }

        .auth-card p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        .auth-input {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 14px;
        }

        .auth-btn {
            width: 100%;
            padding: 13px;
            background: var(--primary-navy);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
        }
        .target-name-area { min-width: 0; max-width: 100%; flex-shrink: 1; }
        .target-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .target-honorific { flex-shrink: 0; }
        .section-person { max-width: 100%; white-space: normal; word-break: keep-all; overflow-wrap: anywhere; }
        .schedule-badge { max-width: 100%; white-space: normal; word-break: keep-all; overflow-wrap: anywhere; }
        .action-btn-group { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .btn-action, .refresh-btn, .day-tab { min-height: 44px; font-family: inherit; }
        .search-input { font-size: 16px; }
        @media (max-width: 390px) {
            .action-btn-group { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .btn-copy { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>

    <!-- 비밀번호 인증 모달 -->
    <div id="authModal" class="auth-overlay">
        <div class="auth-card">
            <h2>관리자 인증</h2>
            <p>신청자 개인정보 조회를 위해 관리자 PIN을 입력해주세요.</p>
            <label for="pwInput" class="auth-label">관리자 PIN</label>
            <input type="password" id="pwInput" class="auth-input" placeholder="4자리 숫자 PIN" inputmode="numeric" maxlength="256" autocomplete="off" autofocus>
            <button class="auth-btn" onclick="checkAuth()">확인</button>
        </div>
    </div>

    <!-- Header -->
    <header class="admin-header">
        <div class="header-title">
            <h1>신앙상담 접수 현황</h1>
            <p>기쁜소식부산대연교회</p>
        </div>
        <div class="header-actions">
            <button class="refresh-btn" onclick="fetchData()">🔄 새로고침</button>
            <button class="refresh-btn" onclick="logout()">로그아웃</button>
        </div>
    </header>

    <div class="container">
        <p id="refreshStatus" role="status" aria-live="polite">인증 후 명단을 확인할 수 있습니다.</p>
        <!-- 요약 바 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">전체 접수</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">10.14(수)</div>
                <div class="stat-value" id="statWed">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">10.15(목)</div>
                <div class="stat-value" id="statThu">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">10.16(금)</div>
                <div class="stat-value" id="statFri">0</div>
            </div>
        </div>

        <!-- 필터 및 검색 -->
        <div class="filter-box">
            <input type="text" id="searchInput" class="search-input" placeholder="이름·소속 교회·전화번호 검색..." oninput="filterData()">
            <div class="day-tabs">
                <button class="day-tab active" onclick="setDayFilter('all', this)">전체보기</button>
                <button class="day-tab" onclick="setDayFilter('10.14', this)">10.14(수)</button>
                <button class="day-tab" onclick="setDayFilter('10.15', this)">10.15(목)</button>
                <button class="day-tab" onclick="setDayFilter('10.16', this)">10.16(금)</button>
            </div>
        </div>

        <!-- 신청자 카드 목록 -->
        <div id="applicantList">
            <div class="empty-state">신청자 데이터를 불러오는 중입니다...</div>
        </div>
    </div>

    <script>
        // Google Apps Script Web App URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyK2LTNVBcG6r-HWtGDNRtdXXiTbIWzoXmTBt9ibmRO37AtsFyZ0GAfyOtia5I5IiI/exec";
        
        // 접근 키는 메모리에만 보관하고 서버에서 검증한다.
        let adminToken = "";
        let fetching = false;
        let refreshTimer;

        let allApplicants = [];
        let currentDayFilter = 'all';

        async function checkAuth() {
            if (fetching) return;
            const input = document.getElementById('pwInput');
            adminToken = input.value.trim();
            if (!/^\d{4}$/.test(adminToken) && (adminToken.length < 32 || adminToken.length > 256)) {
                adminToken = '';
                alert('설정한 32자 이상의 관리자 PIN을 입력해주세요.');
                return;
            }
            const ok = await fetchData();
            input.value = '';
            if (ok) {
                document.getElementById('authModal').style.display = 'none';
                scheduleRefresh();
            }
            else adminToken = '';
        }

        document.getElementById('pwInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAuth();
        });

        // 한국 휴대전화/일반 유선번호만 허용. 여러 번호나 임의 문자열은 차단.
        function normalizePhone(value) {
            if (value == null || value === '') return '';
            const raw = String(value).trim();
            if (!/^\+?[0-9()\s-]+$/.test(raw)) return '';
            let n = raw.replace(/[()\s-]/g, '');
            if (n.startsWith('+82')) n = '0' + n.slice(3);
            if (/^10\d{8}$/.test(n)) n = '0' + n;
            const mobile = /^010\d{8}$|^01[16789]\d{7,8}$/;
            const landline = /^02\d{7,8}$|^0(?:31|32|33|41|42|43|44|51|52|53|54|55|61|62|63|64)\d{7,8}$|^070\d{8}$/;
            return mobile.test(n) || landline.test(n) ? n : '';
        }
        function extractSinglePhone(value) { return normalizePhone(value); }
        function formatPhone(value) {
            const n = normalizePhone(value);
            if (!n) return '';
            return n.startsWith('02')
                ? n.replace(/^(02)(\d{3,4})(\d{4})$/, '$1-$2-$3')
                : n.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
        }
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g,
                ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }
        async function requestJson(url, options = {}) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 20000);
            try {
                const response = await fetch(url, {...options, signal: controller.signal});
                if (!response.ok) throw new Error('HTTP_ERROR');
                let result;
                try { result = JSON.parse(await response.text()); }
                catch { throw new Error('INVALID_RESPONSE'); }
                if (!result || typeof result !== 'object' || Array.isArray(result)) {
                    throw new Error('INVALID_RESPONSE');
                }
                if (result.result !== 'success') throw new Error(result.code || 'SERVER_ERROR');
                return result;
            } finally { clearTimeout(timer); }
        }
        // 접수일시 포맷팅 (10.07 13:29 형식으로 단정하게)
        function formatCleanDate(raw) {
            const s = String(raw ?? '');
            // 서버가 반환하는 서울 시각 문자열은 Date의 브라우저별 파싱을 거치지 않는다.
            const m = s.match(/^\d{4}-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
            return m ? `${m[1]}.${m[2]} ${m[3]}:${m[4]}` : s.slice(0, 16);
        }
        function scheduleRefresh(delay = 30000) {
            clearTimeout(refreshTimer);
            if (!adminToken) return;
            refreshTimer = setTimeout(async () => {
                if (document.hidden) { scheduleRefresh(delay); return; }
                const ok = await fetchData(true);
                scheduleRefresh(ok ? 30000 : Math.min(delay * 2, 300000));
            }, delay);
        }
        function logout() {
            adminToken = '';
            clearTimeout(refreshTimer);
            allApplicants = [];
            updateStats();
            document.getElementById('applicantList').textContent = '인증 후 명단을 확인할 수 있습니다.';
            document.getElementById('refreshStatus').textContent = '인증이 필요합니다.';
            document.getElementById('authModal').style.display = 'flex';
            const input = document.getElementById('pwInput');
            input.value = '';
            input.focus();
        }
        function showApplicantNames(button) {
            alert(`초청자: ${button.dataset.inviter}
초청받으신 분: ${button.dataset.invitee}`);
        }
        async function fetchData(background = false) {
            if (!adminToken || fetching) return false;
            fetching = true;
            const requestedToken = adminToken;
            const status = document.getElementById('refreshStatus');
            status.textContent = '최신 명단을 확인하는 중입니다...';
            const refresh = document.querySelector('.refresh-btn');
            refresh.disabled = true;
            const listEl = document.getElementById('applicantList');
            try {
                const result = await requestJson(SCRIPT_URL, {
                    method: 'POST',
                    body: new URLSearchParams({action: 'list', admin_token: adminToken})
                });
                if (adminToken !== requestedToken) return false;
                if (!Array.isArray(result.data)) throw new Error('INVALID_RESPONSE');
                const fields = ['timestamp','inviter','inviterPhone','invitee','inviteePhone','day','time','note','church'];
                const next = result.data.map(item => {
                    if (!item || typeof item !== 'object' || Array.isArray(item)) throw new Error('INVALID_RESPONSE');
                    return Object.fromEntries(fields.map(key => [key, String(item[key] ?? '')]));
                });
                allApplicants = next; // 쉼표를 이용한 추정 복구는 하지 않는다.
                updateStats(); filterData();
                const updatedAt = new Date().toLocaleTimeString('ko-KR', {timeZone: 'Asia/Seoul'});
                status.textContent = `최근 갱신 ${updatedAt} · 30초마다 자동 확인`;
                if (!background) scheduleRefresh();
                return true;
            } catch (error) {
                if (adminToken !== requestedToken) return false;
                if (error.message === 'UNAUTHORIZED') {
                    adminToken = '';
                    allApplicants = [];
                    updateStats();
                    listEl.textContent = '인증이 필요합니다.';
                    clearTimeout(refreshTimer);
                    document.getElementById('authModal').style.display = 'flex';
                }
                status.textContent = error.message === 'UNAUTHORIZED'
                    ? '인증이 필요합니다.'
                    : '갱신 실패 · 표시된 명단은 최신 정보가 아닐 수 있습니다.';
                if (!background) alert(error.message === 'UNAUTHORIZED'
                    ? '관리자 PIN을 확인해주세요.'
                    : '명단을 갱신하지 못했습니다. 기존 명단은 최신 정보가 아닐 수 있습니다. 다시 시도해주세요.');
                return false;
            } finally { fetching = false; refresh.disabled = false; }
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = allApplicants.length;
            document.getElementById('statWed').textContent = allApplicants.filter(a => String(a.day).includes('10.14')).length;
            document.getElementById('statThu').textContent = allApplicants.filter(a => String(a.day).includes('10.15')).length;
            document.getElementById('statFri').textContent = allApplicants.filter(a => String(a.day).includes('10.16')).length;
        }

        function setDayFilter(day, el) {
            currentDayFilter = day;
            document.querySelectorAll('.day-tab').forEach(tab => tab.classList.remove('active'));
            el.classList.add('active');
            filterData();
        }

        // 초청자에게 보내는 확인 문자
        function sendSmsToInviter(phone) {
            const cleanPhone = extractSinglePhone(phone);
            if (!cleanPhone) {
                alert("초청자 연락처가 없습니다.");
                return;
            }
            const body = "안녕하세요. 오늘 초청하신 분 오셨는지 상담 가능하신지 여부 확인 부탁드립니다.";
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const separator = isIOS ? '&' : '?';
            window.location.href = `sms:${cleanPhone}${separator}body=${encodeURIComponent(body)}`;
        }

        // 요청하신 카카오톡 확인 메시지 복사
        async function copyKakaoMessage() {
            const msg = "안녕하세요. 오늘 초청하신 분 오셨는지 상담 가능하신지 여부 확인 부탁드립니다.";
            try {
                if (!window.isSecureContext || !navigator.clipboard?.writeText) throw new Error('UNAVAILABLE');
                await navigator.clipboard.writeText(msg);
                alert('확인 메시지가 복사되었습니다.');
            } catch {
                // 권한이 없거나 API가 없으면 자동 복사 성공이라고 알리지 않는다.
                prompt('자동 복사가 불가능합니다. 아래 문구를 길게 눌러 직접 복사해주세요:', msg);
            }
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const listEl = document.getElementById('applicantList');

            const filtered = allApplicants.filter(item => {
                const dayStr = String(item.day || "");
                const matchDay = currentDayFilter === 'all' || dayStr.includes(currentDayFilter);
                
                const inviteeStr = String(item.invitee || "").toLowerCase();
                const inviterStr = String(item.inviter || "").toLowerCase();
                const churchStr = String(item.church || "").toLowerCase();
                const inviteePhoneStr = String(item.inviteePhone || "");
                const inviterPhoneStr = String(item.inviterPhone || "");

                const matchQuery = !query || 
                    inviteeStr.includes(query) ||
                    inviterStr.includes(query) ||
                    churchStr.includes(query) ||
                    inviteePhoneStr.includes(query) || inviterPhoneStr.includes(query) ||
                    (/^[\d\s()+-]+$/.test(query) && query.replace(/\D/g, '').length > 0 &&
                        [inviteePhoneStr, inviterPhoneStr].some(p => {
                            const digits = normalizePhone(p) || p.replace(/\D/g, '');
                            return digits.includes(query.replace(/\D/g, ''));
                        }));
                return matchDay && matchQuery;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="empty-state">해당하는 신청 내역이 없습니다.</div>';
                return;
            }

            listEl.innerHTML = filtered.map(item => {
                const inviterPhoneClean = extractSinglePhone(item.inviterPhone);
                const inviteePhoneClean = extractSinglePhone(item.inviteePhone);

                const inviterPhoneFormatted = formatPhone(inviterPhoneClean);
                const inviteePhoneFormatted = formatPhone(inviteePhoneClean);

                // 초청자 액션 버튼 3개 (통화, 문자, 카톡용 복사) - 연락처 저장 버튼은 삭제됨
                const inviterActions = inviterPhoneClean ? `
                    <div class="action-btn-group">
                        <a href="tel:${inviterPhoneClean}" class="btn-action btn-call">📞 통화</a>
                        <button class="btn-action btn-sms" onclick="sendSmsToInviter('${inviterPhoneClean}')">💬 문자</button>
                        <button class="btn-action btn-copy" onclick="copyKakaoMessage()">📋 카톡용 복사</button>
                    </div>
                ` : `
                    <div class="action-btn-group">
                        <button class="btn-action btn-copy" onclick="copyKakaoMessage()" style="grid-column: 1 / -1;">📋 카톡용 복사</button>
                    </div>
                `;

                // 대상자 번호는 표시만 한다. 모든 연락 액션은 초청자 전용.
                const inviteeActions = inviteePhoneClean
                    ? `<span>${escapeHtml(inviteePhoneFormatted)}</span>`
                    : '<span>연락처 없음 또는 확인 필요</span>';

                const noteHtml = item.note ? `<div class="note-box">💬 <strong>전달사항:</strong> ${escapeHtml(item.note)}</div>` : '';

                return `
                    <div class="applicant-card">
                        <div class="card-header-row">
                            <div class="target-name-area">
                                <button type="button" class="target-name" title="전체 이름 확인" aria-label="전체 이름 확인" data-inviter="${escapeHtml(item.inviter)}" data-invitee="${escapeHtml(item.invitee)}" onclick="showApplicantNames(this)">${escapeHtml(item.invitee)}</button>
                                <span class="target-honorific">님 (초청받으신 분)</span>
                            </div>
                            <div class="schedule-badge">
                                ${escapeHtml(item.day)} ${escapeHtml(item.time)}
                            </div>
                        </div>

                        <div class="church-line"><strong>소속 교회:</strong> ${escapeHtml(item.church || '미입력')}</div>

                        <!-- 초청자 섹션 (연락 및 카톡 연동 핵심) -->
                        <div class="info-section inviter-section">
                            <div class="info-section-header">
                                <span class="section-label">📢 초청자 안내 및 연락</span>
                                <span class="section-person">${escapeHtml(item.inviter)} ${inviterPhoneFormatted ? `(${inviterPhoneFormatted})` : ''}</span>
                            </div>
                            ${inviterActions}
                        </div>

                        <!-- 초청받으신 분 정보 -->
                        <div class="info-section invitee-section">
                            <div class="info-section-header">
                                <span class="section-label">초청받으신 분 연락처</span>
                                <div>${inviteeActions}</div>
                            </div>
                        </div>

                        ${noteHtml}
                        <div class="card-footer-time">접수일시: ${escapeHtml(formatCleanDate(item.timestamp))}</div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
